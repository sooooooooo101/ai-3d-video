<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="three.min.js"></script>
<script src="characters.js"></script>
<script src="props.js"></script>
<script src="stage.js"></script>
</head>
<body>
<script>
// 「図面どおり」20s / 9:16.  A 0-5 meeting (indoor) | B 5-10 the day, gust | C 10-15 the tree | D 15-20 punchline
AI3DStage.start({
  aspect: '9:16',
  setup({ THREE, scene, camera, util }) {
    const { clamp01, lerp, seg, pulse } = util;
    const mat = (r, g, b, rough = 0.8) => AI3DChars.stdMat(THREE, [r, g, b], rough);
    const box = (parent, w, h, d, m, x, y, z) => {
      const o = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
      o.position.set(x, y, z); o.castShadow = true; o.receiveShadow = true; parent.add(o); return o;
    };
    const V = (x, y, z) => new THREE.Vector3(x, y, z);

    // ---- Layout: map (normalised u,v in +-0.5) <-> real site. Same numbers drive both, so the cut matches. ----
    const PW = 0.405, PD = 0.54;                 // paper size
    const SITE = { cx: -0.25, cz: -1.3, w: 3, d: 4 };
    const MARK = { sign: [0.333, 0.25], desk: [-0.25, 0.0], df: [0.37, -0.4] };
    const world = ([u, v]) => [SITE.cx + u * SITE.w, SITE.cz + v * SITE.d];

    function makeMap() {                          // blank plan: field, desk mark, sign mark, tiny dragonfly mark
      const g = new THREE.Group();
      box(g, PW, 0.004, PD, mat(0.97, 0.96, 0.92, 0.6), 0, 0, 0);
      box(g, PW - 0.04, 0.002, PD - 0.04, mat(0.62, 0.80, 0.52), 0, 0.003, 0).castShadow = false;
      const mk = (m, w, d, [u, v]) => { box(g, w, 0.002, d, m, u * PW, 0.005, v * PD).castShadow = false; };
      mk(mat(0.25, 0.48, 0.78), 0.075, 0.04, MARK.desk);
      mk(mat(0.85, 0.25, 0.2), 0.05, 0.022, MARK.sign);
      const d = new THREE.Group(); d.position.set(MARK.df[0] * PW, 0.006, MARK.df[1] * PD); d.rotation.y = -0.5; g.add(d);
      const or = mat(1, 0.34, 0.035);
      box(d, 0.008, 0.002, 0.05, or, 0, 0, 0).castShadow = false;
      [[-1, -0.012, 0.35], [1, -0.012, -0.35], [-1, 0.002, -0.3], [1, 0.002, 0.3]].forEach(([s, z, r]) => {
        const w = box(d, 0.03, 0.002, 0.007, or, s * 0.018, 0, z); w.rotation.y = r; w.castShadow = false;
      });
      return g;
    }

    // ---- Indoor (meeting) ----
    const indoor = new THREE.Group(); scene.add(indoor);
    const hall = AI3DProps.createSchoolHall(THREE, indoor);
    const desk = hall.deskGroup; scene.add(desk); desk.rotation.y = 0;     // desk is shared by both days
    const deskMap = makeMap(); scene.add(deskMap);

    // ---- Outdoor (event day) ----
    const outdoor = new THREE.Group(); scene.add(outdoor);
    AI3DProps.createOutdoor(THREE, outdoor);       // grass + school building in the distance
    box(outdoor, SITE.w, 0.01, SITE.d, mat(0.62, 0.80, 0.52, 0.95), SITE.cx, 0.005, SITE.cz).castShadow = false;
    // the tree nobody put on the plan, standing exactly on the desk mark
    const [tx, tz] = world(MARK.desk);
    const treeProp = AI3DProps.createTree(THREE), tree = treeProp.mesh, crown = treeProp.crown;
    tree.position.set(tx, 0, tz); outdoor.add(tree);
    // blank standing signboard
    const [sx, sz] = world(MARK.sign);
    const sign = AI3DProps.createSignboard(THREE).mesh; outdoor.add(sign);
    // wind streaks
    const streakMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.75 });
    const streaks = Array.from({ length: 14 }, (_, i) => {
      const s = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.012, 0.012), streakMat); outdoor.add(s); return s;
    });

    // ---- Characters ----
    const boy = AI3DChars.createBoy(THREE); scene.add(boy.group);
    const df = AI3DChars.createDragonfly(THREE); df.group.scale.setScalar(0.7); scene.add(df.group);
    const heldMap = makeMap(); heldMap.scale.setScalar(0.9); boy.group.add(heldMap);
    heldMap.rotation.x = -0.44; heldMap.position.set(0, 0.955, 0.42);      // pinched between the hands, tilted to his face

    const skyIn = new THREE.Color(0xf3ead9), skyOut = new THREE.Color(0xbfe3f5);
    const DESK_TOP = 0.777;
    const setArm = (side, ux, uz, fx) => { boy.arms[side].upper.rotation.set(ux, 0, uz); boy.arms[side].fore.rotation.set(fx, 0, 0); };
    const setCam = (p, t) => { camera.position.copy(p); camera.lookAt(t); };
    const mapCam = (cx, cy, cz, k) => [V(cx, cy + 1.14 * k, cz + 0.96 * k), V(cx, cy, cz)];   // same angle for map and site

    return function update(t, mouth) {
      const mDf = mouth.df || 0, mBoy = mouth.boy || 0;
      const day = t >= 5.0;
      indoor.visible = !day; outdoor.visible = day; scene.background = day ? skyOut : skyIn;

      // defaults
      boy.setHoldPose(0); heldMap.visible = false; deskMap.visible = false;
      let hx = 0, hy = 0, hz = 0;
      let dfPos = V(0, 0, 0), dfYaw = -0.45, dfPitch = 0.42, dfRoll = 0, wingAmp = 0.3;
      const bob = Math.sin(t * 5.2) * 0.03;
      const gust = seg(t, 7.7, 7.95) * (1 - seg(t, 8.9, 9.6));
      crown.rotation.z = Math.sin(t * 1.7) * 0.015 + gust * 0.1;
      streaks.forEach((s, i) => {
        const u = ((t - 7.6) * 5.5 + i * 0.83) % 6;
        s.visible = day && t > 7.6 && t < 9.3;
        s.position.set(-2.6 + u, 0.35 + ((i * 0.37) % 1) * 1.7, -0.9 + ((i * 0.61) % 1) * 1.9);
      });

      if (!day) {
        // ===== A: the meeting =====
        desk.position.set(0, 0, 0.3);
        deskMap.visible = true; deskMap.position.set(0, DESK_TOP, 0.3);
        boy.group.position.set(0.1, 0, -0.45); boy.group.rotation.y = 0;
        const tapL = pulse(t, 0.45, 0.9), tapR = pulse(t, 1.35, 0.9);          // "受付ここ" / "看板ここ"
        setArm('L', -0.5 * tapL, -0.08, -0.9 * tapL);
        setArm('R', -0.5 * tapR, 0.08, -0.9 * tapR);
        const proud = pulse(t, 2.2, 0.7);                                         // "完璧！" chest out, chin up
        hx = 0.35 * Math.max(tapL, tapR) - 0.22 * proud;
        hy = -0.18 * tapL + 0.18 * tapR + 0.3 * seg(t, 2.9, 3.2) * (1 - seg(t, 4.5, 4.8));
        hx += (pulse(t, 4.0, 0.25) + pulse(t, 4.28, 0.25)) * 0.3;                // satisfied nod
        boy.setExpression('happy'); boy.setMouth(mBoy, 1.6, 1.3);
        dfPos.set(0.4, 1.78 + bob, -0.5);
        dfPitch += (pulse(t, 4.0, 0.25) + pulse(t, 4.28, 0.25)) * 0.3 + mDf * 0.12;   // nods along
        const k = seg(t, 4.3, 4.95);                                              // push in to the plan
        const [mp, mt] = mapCam(0, DESK_TOP, 0.3, 1);
        setCam(V(0.1, 2.35, 2.9).lerp(mp, k), V(0.1, 0.98, 0.0).lerp(mt, k));
      } else if (t < 10.0) {
        // ===== B: the day. Same angle as the plan, then the gust takes the sign =====
        desk.position.set(2.3, 0, 0.9);
        boy.group.position.set(-0.25, 0, 0); boy.group.rotation.y = 0.2;
        const pointing = seg(t, 6.3, 6.8);                                        // points at the sign and stays frozen
        setArm('R', 0, 0.08 + 1.2 * pointing, 0);
        setArm('L', 0, -0.08, 0);
        const frozen = seg(t, 7.9, 8.1);
        hy = lerp(0.35 * pointing, 0.45, frozen); hx = -0.05;
        if (t < 7.9) { boy.setExpression('happy'); boy.setMouth(mBoy, 1.5, 1.2); }
        else { boy.setExpression('confused', 0.6); boy.setMouth(0.25, 0.7, 1.6); boy.eyes.forEach(e => { e.scale.y = 1.35; }); }
        const fly = clamp01((t - 7.85) / 0.9);                                    // sign tips, lifts, leaves frame right
        sign.position.set(sx + fly * fly * 4.2, Math.sin(fly * 2.2) * 1.5, sz + fly * 0.6);
        sign.rotation.set(fly * 2.2, fly * 1.5, -fly * 5.5);
        dfPos.set(0.3 + gust * 0.32, 1.78 + bob + gust * 0.1, 0.2); dfRoll = -gust * 0.5;
        const [wp, wt] = mapCam(SITE.cx, 0, SITE.cz, SITE.w / PW);
        const k = seg(t, 5.55, 6.5);
        setCam(wp.lerp(V(0.1, 1.5, 4.5), k), wt.lerp(V(0.1, 1.0, -0.1), k));
      } else if (t < 15.0) {
        // ===== C: plan vs. reality. A big tree stands where the desk goes =====
        desk.position.set(2.3, 0, 0.9);
        sign.position.set(40, 0, 0);
        boy.group.position.set(-0.25, 0, 0); boy.group.rotation.y = -0.25;
        boy.setHoldPose(1); heldMap.visible = true;
        // map -> tree -> map -> tree, then stays on the tree for the line
        const atTree = seg(t, 10.4, 10.7) * (1 - seg(t, 10.95, 11.2)) + seg(t, 11.45, 11.75) * (1 - seg(t, 13.9, 14.2));
        hx = lerp(0.42, -0.12, atTree); hy = lerp(0, -1.0, atTree);
        hy = lerp(hy, 0.7, seg(t, 14.2, 14.5)); hx = lerp(hx, -0.25, seg(t, 14.2, 14.5));   // turns to the dragonfly
        boy.setExpression('confused', 1); boy.setMouth(mBoy * 0.8, 0.9, 1.0);
        dfPos.set(0.12, 1.86 + bob, 0.2); dfPitch += mDf * 0.12; dfYaw = -0.6;
        setCam(V(-0.2, 1.5, 4.7), V(-0.15, 1.2, -0.5));
      } else {
        // ===== D: the one thing that matches =====
        desk.position.set(2.3, 0, 0.9);
        sign.position.set(40, 0, 0);
        boy.group.position.set(2.2, 0, 0.15); boy.group.rotation.y = 0;
        const put = seg(t, 15.0, 15.5);                                           // lays the plan on the desk
        deskMap.visible = true; deskMap.position.set(2.3, lerp(DESK_TOP + 0.22, DESK_TOP, put), 0.9);
        deskMap.rotation.x = lerp(-0.3, 0, put);
        const arms = 1 - seg(t, 15.4, 15.9);
        const pointDf = seg(t, 16.0, 16.3) * (1 - seg(t, 17.9, 18.3));            // small weary point at the dragonfly
        setArm('L', -0.5 * arms, -0.08, -0.9 * arms);
        setArm('R', -0.5 * Math.max(arms, pointDf), 0.08, -0.9 * Math.max(arms, pointDf));
        const toCam = seg(t, 18.95, 19.5);
        hx = lerp(lerp(0.42, 0.3, seg(t, 15.9, 16.2)), 0.02, toCam); hy = lerp(0.3 * seg(t, 15.6, 16.0), 0, toCam);
        boy.setExpression('deadpan', 1); boy.setMouth(mBoy * 0.7, 0.85, 1.0);
        // dragonfly lands on its own mark (top-right of the plan), tail off the paper
        const mark = V(2.3 + MARK.df[0] * PW, DESK_TOP, 0.9 + MARK.df[1] * PD);
        const land = seg(t, 15.3, 16.0), rest = V(mark.x + 0.13, mark.y + 0.062, mark.z - 0.06);
        dfPos.copy(V(2.75, 1.75 + bob, 0.9).lerp(rest, land));
        dfYaw = lerp(-0.6, -1.15, land); dfPitch = lerp(0.42, 0, land); wingAmp = lerp(0.3, 0.03, land);
        dfPos.y += pulse(t, 18.15, 0.3) * 0.05 + pulse(t, 18.5, 0.3) * 0.04;      // pleased hop "計画どおり！"
        const k = seg(t, 15.8, 16.6) * (1 - seg(t, 18.8, 19.4) * 0.45);
        setCam(V(2.3, 1.85, 3.6).lerp(V(2.38, 1.6, 2.7), k), V(2.3, 1.02, 0.5).lerp(V(2.36, 0.98, 0.6), k));
      }

      boy.head.rotation.set(hx, hy, hz);
      if ((t % 2.9) > 2.78 && !(t > 7.9 && t < 10)) boy.eyes.forEach(e => { e.scale.y *= 0.15; });
      df.wingbeat(t, 40, wingAmp); df.setMouth(mDf);
      df.group.position.set(dfPos.x, dfPos.y - 0.7, dfPos.z);     // body sits at local y=1.0 * scale 0.7
      df.group.rotation.set(0, dfYaw, dfRoll);
      df.bodyPivot.rotation.x = dfPitch;
    };
  },
});
</script>
</body>
</html>
